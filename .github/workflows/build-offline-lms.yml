name: Build Sytbay Offline LMS
on:
  workflow_dispatch:
  push:
    branches: [sytbay-offline-lms]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q offline-lms-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: sytbay-offline-lms/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sytbay-offline-learning-apk
          path: sytbay-offline-lms/android/app/build/outputs/apk/debug/app-debug.apk
