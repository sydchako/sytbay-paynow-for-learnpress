name: Build Sytbay Offline LMS
on:
  workflow_dispatch:
  push:
    branches: [sytbay-offline-lms]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          cat source.b64.00 source.b64.01 source.b64.02a source.b64.02b source.b64.02c source.b64.03a source.b64.03b source.b64.03c | base64 -d > source.tar.gz
          gzip -t source.tar.gz
          tar -xzf source.tar.gz
          test -f sytbay-offline-lms/android/settings.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: sytbay-offline-lms/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sytbay-offline-learning-apk
          path: sytbay-offline-lms/android/app/build/outputs/apk/debug/app-debug.apk
